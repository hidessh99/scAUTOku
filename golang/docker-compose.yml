version: '3.8'

services:
  vpn-api:
    build: .
    container_name: vpn-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_KEY=your_api_key_here
      - JWT_SECRET=your_jwt_secret_here
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
    restart: unless-stopped
    # If you want to use the pre-built image from Docker Hub, uncomment the next line
    # image: your-dockerhub-username/vpn-api:latest